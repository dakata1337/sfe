<?xml version="1.0" encoding="UTF-8"?>
<!-- sfe logo: a folder whose front shows the split layout (one view on the
     left, two stacked on the right; the active one brightest). MIT. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="front" x1="0" y1="40" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a9bff"/>
      <stop offset="1" stop-color="#3b73e8"/>
    </linearGradient>
  </defs>
  <!-- back with the tab -->
  <path fill="#2858c4" d="M23 16h22.5c2.7 0 4.4.7 6.3 2.6l5.6 5.6c1.1 1.1 2.1 1.5 3.7 1.5H105c6.1 0 11 4.9 11 11V98H12V27c0-6.1 4.9-11 11-11z"/>
  <!-- front -->
  <rect x="12" y="38" width="104" height="74" rx="11" fill="url(#front)"/>
  <!-- the three views -->
  <rect x="26" y="53" width="34" height="45" rx="5" fill="#ffffff"/>
  <rect x="68" y="53" width="34" height="18.5" rx="5" fill="#ffffff" fill-opacity="0.62"/>
  <rect x="68" y="79.5" width="34" height="18.5" rx="5" fill="#ffffff" fill-opacity="0.62"/>
</svg>
